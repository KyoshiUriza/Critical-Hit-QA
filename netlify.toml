[build]
  publish = "."

# ─── Security headers (applies to everything) ───
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # No external assets are ever loaded. 'unsafe-inline' stays on script-src
    # because several pages still ship inline <script> blocks; extracting them
    # into js/ files is the prerequisite for dropping it.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# ─── Caching ───
# HTML must revalidate every time, otherwise a deploy leaves users on a stale
# page that references JS they no longer have. (Hit exactly this during dev.)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# JS and CSS are unversioned filenames, so they cannot be cached immutably —
# a short TTL with revalidation keeps deploys from going stale.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
