<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <title>Practice Tests — Critical Hit QA</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="practice-tests" data-depth="1">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="container">
    <div class="page-header">
      <h1>Practice Tests</h1>
      <p>Timed multiple-choice quizzes. Pick a category, get instant explanations after each answer.</p>
    </div>

    <section id="setup-screen" class="panel">
      <h2>Configure your quiz</h2>
      <div class="quiz-controls">
        <label>
          <span class="text-dim">Category:</span>
          <select id="category-select">
            <option value="all">All categories</option>
            <option value="fundamentals">Fundamentals</option>
            <option value="manual">Manual Testing</option>
            <option value="automation">Automation</option>
            <option value="api">API Testing</option>
            <option value="agile">Agile & Process</option>
            <option value="performance">Performance</option>
            <option value="sql">SQL for QA</option>
            <option value="ai">AI in Testing</option>
          </select>
        </label>
        <label>
          <span class="text-dim">Number of questions:</span>
          <span class="count-row">
            <input id="question-count" type="number" min="1" value="10" data-testid="question-count" />
            <button type="button" class="btn btn-ghost btn-sm" id="use-all" data-testid="use-all">All</button>
          </span>
        </label>
        <label>
          <span class="text-dim">Time limit (minutes, 0 = none):</span>
          <input id="time-limit" type="number" min="0" max="60" value="10" />
        </label>
        <button class="btn btn-primary" id="start-btn" data-testid="start-quiz">Start quiz</button>
      </div>
      <p class="text-dim quiz-pool-hint" id="pool-hint" data-testid="pool-hint" aria-live="polite"></p>
    </section>

    <section id="quiz-screen" class="panel hidden">
      <div class="quiz-meta">
        <span id="progress-label">Question 1 of 10</span> ·
        <span id="category-label">Category</span> ·
        <span class="quiz-timer" id="timer-label">--:--</span>
      </div>
      <div class="quiz-progress"><div class="quiz-progress-bar" id="progress-bar"></div></div>
      <div class="quiz-question">
        <h2 id="question-text"></h2>
        <div id="choices-list"></div>
        <div class="quiz-explanation hidden" id="explanation-box"></div>
      </div>
      <div class="quiz-nav">
        <button class="btn btn-ghost" id="quit-btn">Quit</button>
        <div>
          <button class="btn btn-ghost hidden" id="check-btn">Check answer</button>
          <button class="btn btn-primary" id="next-btn" disabled>Next →</button>
        </div>
      </div>
    </section>

    <section id="results-screen" class="panel hidden">
      <div class="quiz-results">
        <h2>Quiz complete!</h2>
        <div class="quiz-score" id="score-display">--/--</div>
        <p id="score-summary" class="text-dim"></p>
        <p id="time-summary" class="text-dim"></p>
        <div style="margin-top:20px;">
          <button class="btn btn-primary" id="review-btn">Review answers</button>
          <button class="btn btn-ghost" id="restart-btn">New quiz</button>
        </div>
      </div>
      <div id="review-list" class="hidden mt-4"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../js/test-hooks.js"></script>
  <script src="../js/site-chrome.js"></script>
  <script src="../js/data/defects.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/rpg.js"></script>
  <script src="../js/data/quiz-questions.js"></script>
  <script src="../js/quiz.js"></script>
</body>
</html>
