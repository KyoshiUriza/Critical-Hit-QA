<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand">QA Prep Hub</a>
      <nav class="nav">

    <div class="page-header">
      <h1>Interview Questions</h1>
      <p>Curated questions with model answers. Click a question to reveal the answer.</p>

    <div class="quiz-controls">
      <input id="search" type="search" placeholder="Search questions..." style="min-width:240px;" />

        <option value="all">All difficulties</option>

        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <span class="text-dim" id="result-count"></span>
    </div>

    <div id="category-tabs" class="category-tabs"></div>
    <div id="questions-list"></div>
  </main>

  <footer class="site-footer">
    <div class="container"><p>QA Prep Hub — a local study companion.</p></div>
