name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish only what the site actually needs. Previously the whole repo
      # went live — tests, ADRs, the design audit script, package.json. None of
      # it is secret, but it is not the site either, and every extra file is
      # something a visitor can stumble into.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html css js pages practice-apps _site/
          cp favicon.svg favicon-16.png favicon-32.png apple-touch-icon.png _site/
          # GitHub Pages runs Jekyll by default, which ignores files and
          # directories beginning with an underscore. Nothing here starts with
          # one today, but .nojekyll makes that a guarantee rather than luck.
          touch _site/.nojekyll
          echo "Published files:"
          find _site -type f | wc -l

      - name: Verify the build is complete
        run: |
          set -e
          for f in _site/index.html _site/css/styles.css _site/js/site-chrome.js \
                   _site/pages/portfolio.html _site/practice-apps/locator-lab.html \
                   _site/favicon.svg _site/apple-touch-icon.png; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          # A stray absolute path breaks the site under the /Critical-Hit-QA/ subpath and
          # would only show up after deploy.
          if grep -rnE '(href|src)="/[^/]' _site --include=*.html --include=*.js; then
            echo "Found root-relative paths — these break under a project subpath."
            exit 1
          fi
          echo "Build looks good."

      # If this step fails with the upload and deploy steps skipped, Pages is
      # not enabled on the repo. The build above will still have passed, so the
      # run looks like a site problem when in fact nothing was ever published.
      # Fix it at Settings -> Pages -> Source -> GitHub Actions; it is a
      # one-time repo setting, not something this file can change.
      #
      # enablement asks configure-pages to create the Pages site over the API.
      # Tried here and it did not work: GITHUB_TOKEN is not permitted to create
      # a Pages site on a repo that has never had one, despite the pages: write
      # grant above. Left in because it is correct and free once the setting
      # exists, but it is not a substitute for the manual toggle.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
