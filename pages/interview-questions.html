<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <title>Interview Questions — Critical Hit QA</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="interview-questions" data-depth="1">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="container">
    <div class="page-header">
      <h1>Interview Questions</h1>
      <p>Curated questions with model answers. Click a question to reveal the answer.</p>
    </div>

    <div class="quiz-controls">
      <input id="search" type="search" placeholder="Search questions..." style="min-width:240px;" />
      <select id="difficulty-filter">
        <option value="all">All difficulties</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <span class="text-dim" id="result-count"></span>
    </div>

    <div id="category-tabs" class="category-tabs"></div>
    <div id="questions-list"></div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/test-hooks.js"></script>
  <script src="../js/site-chrome.js"></script>
  <script src="../js/data/defects.js"></script>
  <script src="../js/profiles.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/rpg.js"></script>
  <script src="../js/data/interview-questions.js"></script>
  <script src="../js/interview.js"></script>
</body>
</html>
